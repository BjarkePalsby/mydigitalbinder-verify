
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Email Verified | My Digital Binder</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0B1220;
      color: #CBD5E1;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    main {
      max-width: 420px;
      padding: 32px;
    }
    h1 { color: #D4AF37; }
    p { line-height: 1.7; }
    .mark { color: #D4AF37; font-size: 42px; }
  </style>
</head>
<body>
  <main>
    <div class="mark">✓</div>
    <h1>MY DIGITAL BINDER</h1>
    <h2>Email confirmation</h2>
    <p id="message">You can now return to My Digital Binder and sign in.</p>
  </main>
  
<script>
  // Remove authentication tokens from the visible URL immediately.
  const params = new URLSearchParams(window.location.search);
  const hash = new URLSearchParams(window.location.hash.slice(1));

  const error = params.get("error") || hash.get("error");
  const type = params.get("type") || hash.get("type");

  window.history.replaceState(
    null,
    "",
    window.location.pathname
  );

  const message = document.getElementById("message");

  message.textContent = error
    ? "Email confirmation failed. Please return to My Digital Binder and try again."
    : type === "signup"
      ? "Your email confirmation link has been processed. Return to My Digital Binder and sign in."
      : "If you confirmed your email, return to My Digital Binder and sign in.";
</script>

</body>
</html>
